<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gruffies Financial Dashboard — Fictional Demo</title><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172d40;background:#f3f6f8;font-size:16px;--green:#125341;--navy:#112d45;--muted:#526578;--red:#a53336}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #248fb0;outline-offset:3px}header{background:var(--navy);color:white;padding:22px 4vw;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:23px;font-weight:750;letter-spacing:-.6px}.brand span{font-weight:400;color:#c1d1dc;font-size:16px;margin-left:18px}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:1.5px;font-weight:700;color:var(--muted)}header .eyebrow{color:#b3c8d9}.topnote{font-size:13px;color:#c2d0da;margin-top:7px}main{max-width:1600px;margin:auto;padding:28px 4vw 50px}.controls{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{background:transparent;border:0;color:#536679;padding:12px 17px;border-radius:8px;font-size:14px;font-weight:650}.tabs button.active{background:var(--green);color:white}.selectors{display:flex;gap:10px;align-items:center}.selectors label{font-size:13px;color:var(--muted)}select{padding:9px 12px;border:1px solid #ccd5dc;border-radius:7px;background:white;color:var(--navy);font-size:14px}.intro{margin:30px 0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}h1{font-size:30px;letter-spacing:-.8px;margin:6px 0 8px}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.6;margin:6px 0 12px}.sub{color:var(--muted);font-size:14px}.badge{border:1px solid #c2d3cd;color:var(--green);padding:6px 10px;border-radius:6px;font-size:12px;white-space:nowrap;background:#eaf3ee}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #dae2e8;border-radius:11px}.card{padding:21px}.card .number{font-size:29px;font-weight:700;margin:12px 0 8px;letter-spacing:-.9px;font-variant-numeric:tabular-nums}.card .detail{font-size:13px;color:var(--muted)}.negative{color:var(--red)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}.panel{padding:24px;min-width:0}.chart{width:100%;height:auto;display:block;min-height:200px}.chart text{font-size:13px;fill:#526578}.legend{display:flex;gap:20px;font-size:13px;color:var(--muted);margin-top:12px}.swatch{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:2px}.observations{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.observation{padding:20px;background:#fff;border:1px solid #dae2e8;border-top:3px solid var(--green);border-radius:8px}.observation p{font-size:14px;color:#475f72}.observation .action{border-top:1px solid #e1e7ec;padding-top:12px;color:#183d35}.stateline{display:flex;gap:25px;flex-wrap:wrap;margin:15px 0 0;color:var(--muted);font-size:13px}.tablewrap{overflow:auto;max-height:70vh;border:1px solid #dde4e9;border-radius:8px}.tablewrap table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}th,td{padding:12px 15px;border-bottom:1px solid #e5ebef;text-align:right}th{background:#eef3f5;color:var(--navy);font-weight:650;position:sticky;top:0;z-index:2}th:first-child,td:first-child{text-align:left;position:sticky;left:0;min-width:230px;max-width:350px;background:#fff;z-index:1}th:first-child{background:#eef3f5;z-index:3}.total td{background:#edf4f0!important;font-weight:750;color:var(--green);border-top:1px solid #c4d5ca}.major td{background:#edf1f7!important;font-weight:750}.section td{background:#f6f8fa!important;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.detailrow td:first-child{padding-left:30px;color:var(--muted)}.blank td{padding:5px;border:0}.note{padding:15px 18px;background:#edf3f8;border-left:3px solid #678dab;border-radius:4px;font-size:14px;color:#3d5970;line-height:1.6;margin:15px 0}.warning{background:#fff6e8;border-color:#b98331;color:#76551d}.check{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #e1e7ec;font-size:14px}.check:last-child{border-bottom:0}.check strong{color:var(--green)}a{color:#126e72;text-underline-offset:3px}.source{padding:17px 0;border-bottom:1px solid #e0e6eb}.source p{font-size:14px;color:var(--muted)}.source a{font-weight:650}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.button{border:1px solid #c7d6db;background:#fff;border-radius:7px;padding:8px 12px;font-size:13px;color:var(--green)}footer{border-top:1px solid #d7e1e7;padding-top:18px;margin-top:30px;color:var(--muted);font-size:12px}.loading{padding:40px}.empty{padding:28px;border:1px dashed #bccbd5;background:#f7fafc;border-radius:8px}.smalltable th:first-child,.smalltable td:first-child{min-width:210px}summary{cursor:pointer;font-size:14px;color:var(--green);padding:10px 0}details{margin-top:14px}.sourcesgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.sourcesgrid{grid-template-columns:1fr}.observations{grid-template-columns:1fr}.brand span{display:block;margin:6px 0 0}.intro{align-items:flex-start}}@media(max-width:600px){header{padding:19px 5vw;align-items:flex-start}.cards{gap:10px}.card{padding:16px}.card .number{font-size:23px}.tabs{width:100%;display:grid;grid-template-columns:1fr 1fr}.tabs button{padding:10px;font-size:13px}.selectors{width:100%;flex-wrap:wrap}.panel{padding:17px}main{padding:20px 5vw}h1{font-size:25px}.badge{white-space:normal;font-size:11px}th,td{padding:10px;font-size:13px}th:first-child,td:first-child{min-width:180px}.intro{flex-direction:column;gap:10px}.topnote{font-size:12px}}@media print{header{color:#172d40;background:white}body{background:white}.tabs,.selectors,.button{display:none}.tablewrap{max-height:none;overflow:visible}.cards{grid-template-columns:repeat(4,1fr)}.panel{break-inside:avoid}.negative{color:#333}}
</style></head><body><div id="app"></div><script>let DATA, view='overview', period='YTD', entity='combined', mode='monthly';
const money=(n,d=0)=>{if(n==null)return '—';if(Math.abs(n)<.5*Math.pow(10,-d))n=0;return (n<0?'(':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d})+(n<0?')':'')};
const num=n=>{if(n==null)return '—';if(Math.abs(n)<.5)n=0;return (n<0?'(':'')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0})+(n<0?')':'')};
const pct=n=>Number.isFinite(n)?(n*100).toFixed(1)+'%':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel=s=>new Date(s+'-15T12:00:00Z').toLocaleDateString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'});
const selected=()=>DATA.months.filter(m=>period==='YTD'||m.quarter===period);
const sum=(ms,k,en=entity)=>ms.reduce((a,m)=>a+(m[en][k]||0),0);
const bs=q=>Object.fromEntries(q.balanceSheet.map(r=>[r.row,r.value]));
const currentQuarter=()=>DATA.quarters.find(q=>q.quarter===(period==='YTD'?'Q3':period));
const card=(label,value,detail,negative=false)=>`<div class="card"><div class="eyebrow">${label}</div><div class="number ${negative?'negative':''}">${value}</div><div class="detail">${detail}</div></div>`;
const note=(s,w=false)=>`<div class="note ${w?'warning':''}">${s}</div>`;
function graph(ms,keys){const width=700,height=260,left=55,top=20,bottom=40,vals=ms.flatMap(m=>keys.map(k=>m[entity][k.key]));let low=Math.min(0,...vals),high=Math.max(0,...vals);let range=high-low||1;high+=range*.1;low-=range*.05;const y=n=>top+(high-n)/(high-low)*(height-top-bottom);const step=(width-left-15)/ms.length;let svg=`<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Monthly financial trend">`;for(let i=0;i<=4;i++){let v=low+(high-low)*i/4;svg+=`<line x1="${left}" x2="${width-10}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e9ed"/><text x="${left-7}" y="${y(v)+4}" text-anchor="end">${Math.round(v/1000)}k</text>`;}ms.forEach((m,i)=>{svg+=`<text x="${left+(i+.5)*step}" y="${height-12}" text-anchor="middle">${monthLabel(m.month).split(' ')[0]}</text>`;keys.forEach((k,j)=>{let v=m[entity][k.key],x=left+(i+.17)*step+j*step*.31;svg+=`<rect x="${x}" y="${Math.min(y(0),y(v))}" width="${step*.28}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" rx="2" fill="${k.color}"><title>${monthLabel(m.month)} ${k.label}: ${money(v)}</title></rect>`;});});return svg+'</svg><div class="legend">'+keys.map(k=>`<span><i class="swatch" style="background:${k.color}"></i>${k.label}</span>`).join('')+'</div>';}
function table(headers,rows,cls='',unit='USD'){return `<div class="tablewrap ${cls}"><table><thead><tr><th>${esc(unit)}</th>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.class||''}"><td>${esc(r.label)}</td>${r.values.map(n=>`<td class="${typeof n==='number'&&n<0?'negative':''}">${typeof n==='number'?num(n):esc(n)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function overview(){let ms=selected(),rev=sum(ms,'revenue'),gross=sum(ms,'grossProfit'),op=sum(ms,'opex'),loss=sum(ms,'netIncome'),b=bs(currentQuarter());let latest=ms.at(-1),prior=ms.at(-2),growth=prior?(latest[entity].revenue/prior[entity].revenue-1):null;let charge=ms.reduce((a,m)=>a+m[entity].expenses[3].value,0),sbc=ms.reduce((a,m)=>a+m[entity].expenses[1].value,0),other=sum(ms,'otherIncome');return `<div class="intro"><div><div class="eyebrow">Management · ${period==='YTD'?'Nine months through July 2026':period+' FY2026'}</div><h1>CFO overview</h1><div class="sub">${entity==='combined'?'Canada + US':entity==='canada'?'Canada · translated to USD':'US subsidiary'} · Fictional demonstration figures</div></div><span class="badge">No intercompany eliminations</span></div><div class="cards">${card('Revenue',money(rev),'Latest month '+money(latest[entity].revenue))}${card('Gross margin',pct(gross/rev),'Gross profit '+money(gross))}${card('Operating expenses',money(op),'Includes stock compensation '+money(sbc))}${card('Net loss',money(loss),'After other income and FX',loss<0)}</div><div class="grid"><section class="panel"><h2>Revenue and gross profit</h2>${graph(ms,[{key:'revenue',label:'Revenue',color:'#125341'},{key:'grossProfit',label:'Gross profit',color:'#5a91af'}])}</section><section class="panel"><h2>Monthly net result</h2>${graph(ms,[{key:'netIncome',label:'Net income / (loss)',color:'#9a4346'}])}<div class="sub">Other income ${money(other)} affects the reported result.</div></section></div><div class="cards">${card('Quarter-end cash',money(b[8]),currentQuarter().quarter+' closing balance · combined entities')}${card('Working capital',money(b[15]-b[29]),'Current assets less current liabilities',b[15]-b[29]<0)}${card('Inventory',money(b[11]),'Quarter-end book carrying amount')}${card('Total equity',money(b[43]),'Intercompany balances and source reserves retained',true)}</div><h2>Management observations</h2><div class="observations"><article class="observation"><div class="eyebrow">Commercial performance</div><h3>${growth==null?'Revenue trend':monthLabel(latest.month)+' revenue '+(growth>=0?'increased':'decreased')+' '+pct(Math.abs(growth))}</h3><p>${growth==null?'Select a longer period to compare months.':'Compared with '+monthLabel(prior.month)+'.'} Distributor chargebacks total ${money(charge)}, equivalent to ${pct(charge/rev)} of the selected period’s total revenue.</p><p class="action"><strong>Management action:</strong> review distributor deductions and contribution margins before increasing promotional spend. The ratio uses total revenue, not gross distributor billings.</p></article><article class="observation"><div class="eyebrow">Quality of earnings</div><h3>Separate non-cash costs and other income</h3><p>Stock compensation accounts for ${pct(sbc/op)} of operating expenses. Other income totals ${money(other)}.</p><p class="action"><strong>Management action:</strong> validate unusual income and large expense postings. Use bank cash movements to assess spending; net loss is not cash burn.</p></article><article class="observation"><div class="eyebrow">Liquidity and financing</div><h3>Cash movements need funding context</h3><p>Combined quarter-end cash is ${money(b[8])}. Selected-entity net bank movement is ${money(cashTotal(cashSelected()).netMovement)} before FX. Latest-month bank payments were ${money(cashSelected().at(-1)[entity].spent)}, against receipts of ${money(cashSelected().at(-1)[entity].received)}. Working capital is ${money(b[15]-b[29])}, including intercompany balances.</p><p class="action"><strong>Management action:</strong> review external debt maturities and separate intercompany obligations. Separate operating payments from funding and internal transfers before estimating runway. Use the Cash Flow tab to inspect monthly receipts, payments and bank balances.</p></article></div>${note('Quarter-end cash, working capital and equity cards show the combined balance sheet even when an entity income-statement view is selected. Observations are generated from fictional figures for demonstration only.')} `;}
function statements(){let ms=selected(),cols=mode==='quarterly'?DATA.quarters.filter(q=>period==='YTD'||q.quarter===period).map(q=>({label:q.quarter,months:ms.filter(m=>m.quarter===q.quarter)})):ms.map(m=>({label:monthLabel(m.month),months:[m]}));cols.push({label:period==='YTD'?'YTD total':'Quarter total',months:ms});let rows=[],push=(label,key,cls)=>rows.push({label,class:cls,values:cols.map(c=>sum(c.months,key))});push('Revenue','revenue','total');push('Cost of goods sold','cogs');push('Gross profit','grossProfit','major');rows.push({label:'Gross margin',values:cols.map(c=>pct(sum(c.months,'grossProfit')/sum(c.months,'revenue')))});rows.push({label:'Operating expenses',class:'section',values:cols.map(()=> '')});DATA.months[0][entity].expenses.forEach((e,j)=>rows.push({label:e.name,class:'detailrow',values:cols.map(c=>c.months.reduce((a,m)=>a+m[entity].expenses[j].value,0))}));push('Total operating expenses','opex','total');push('Operating income / (loss)','operatingIncome','major');push('Interest income','interestIncome');push('Other / miscellaneous income','otherIncome');push('Additional FX income / (expense)','fxIncome');push('Net income / (loss)','netIncome','total');let q=currentQuarter();return `<div class="intro"><div><div class="eyebrow">FY2026 · Synthetic demo</div><h1>Monthly financial statements</h1><div class="sub">USD · ${entity==='combined'?'Canada and US combined':entity==='canada'?'Canada translated at quarter-end FX':'US subsidiary'}</div></div><span class="badge">No intercompany eliminations</span></div><section class="panel"><div class="toolbar"><h2>Income statement</h2><div><label class="sub" for="mode">Columns </label><select id="mode"><option value="monthly" ${mode==='monthly'?'selected':''}>Monthly</option><option value="quarterly" ${mode==='quarterly'?'selected':''}>Quarterly</option></select></div></div>${table(cols.map(c=>c.label),rows)}<div class="stateline"><span>Full precision used in calculations; tables display whole USD.</span><span>Canada uses each quarter’s closing FX rate.</span></div></section><section class="panel" style="margin-top:20px"><h2>Quarter-end balance sheets · combined</h2>${table(DATA.quarters.map(q=>q.quarter+' closing'),DATA.quarters[0].balanceSheet.map(r=>({label:r.label.replace('Current Period Net Loss','Current year earnings (YTD)'),class:[19,35,43,44].includes(r.row)?'total':[15,18,29,34].includes(r.row)?'major':'',values:DATA.quarters.map(q=>bs(q)[r.row])})))}${note(DATA.balanceNote)}<div class="sub">Balance sheets are quarter-end snapshots. Monthly balance sheets are not inferred from quarterly data.</div></section>`;}
const cashSelected=()=>DATA.cashFlow.months.filter(m=>period==='YTD'||m.quarter===period);
function cashTotal(ms,en=entity){let v={opening:ms[0][en].opening,closing:ms.at(-1)[en].closing};for(let k of ['received','spent','netMovement','revaluation','translation','difference'])v[k]=ms.reduce((a,m)=>a+m[en][k],0);v.change=v.closing-v.opening;return v;}
function cashflow(){let ms=cashSelected(),t=cashTotal(ms),cols=mode==='quarterly'?DATA.quarters.filter(q=>period==='YTD'||q.quarter===period).map(q=>({label:q.quarter,months:ms.filter(m=>m.quarter===q.quarter)})):ms.map(m=>({label:monthLabel(m.month),months:[m]}));cols.push({label:period==='YTD'?'YTD movement':'Quarter movement',months:ms});let vals=cols.map(c=>cashTotal(c.months));let rows=[['Opening cash','opening','major'],['Bank receipts · includes transfers','received'],['Bank payments · includes transfers','spent'],['Net recorded bank movement','netMovement','major'],['Illustrative bank currency adjustment','revaluation'],['CAD → USD presentation adjustment','translation'],['Closing cash','closing','total'],['Cash reconciliation difference','difference']].map(([label,k,cl])=>({label,class:cl,values:vals.map(v=>k==='spent'?-v[k]:v[k])}));let banks=(entity==='combined'?['canada','us']:[entity]).map(en=>{let names=[...new Set(ms.flatMap(m=>m[en].accounts.map(a=>a.name)))];return `<details><summary>${en==='canada'?'Canada · CAD book values':'US subsidiary · USD book values'} · account detail</summary><p class="sub">Balances are in the entity’s book currency, including translated foreign-currency accounts. Opening is the first day and closing the last day of the selected period.</p>${table(['Opening','Receipts','Payments','Bank FX','Closing'],names.map(name=>{let as=ms.map(m=>m[en].accounts.find(a=>a.name===name)||{opening:0,received:0,spent:0,revaluation:0,closing:0});return {label:name,values:[as[0].opening,as.reduce((a,r)=>a+r.received,0),-as.reduce((a,r)=>a+r.spent,0),as.reduce((a,r)=>a+r.revaluation,0),as.at(-1).closing]}}),'smalltable',en==='canada'?'CAD':'USD')}</details>`}).join('');return `<div class="intro"><div><div class="eyebrow">Synthetic bank records · ${period==='YTD'?'November 2025–July 2026':period+' FY2026'}</div><h1>Cash flow and liquidity</h1><div class="sub">${entity==='combined'?'Canada + US':entity==='canada'?'Canada · translated to USD':'US subsidiary'} · USD presentation</div></div><span class="badge">No intercompany eliminations</span></div><div class="cards">${card('Opening cash',money(t.opening),'Start of selected period')}${card('Closing cash',money(t.closing),'Matches the statement cash perimeter')}${card('Net bank movement',money(t.netMovement),'Receipts less payments · before FX',t.netMovement<0)}${card('Total cash change',money(t.change),'Includes bank FX and presentation FX',t.change<0)}</div><section class="panel"><div class="toolbar"><h2>Monthly cash reconciliation</h2><div><label for="mode" class="sub">Columns </label><select id="mode"><option value="monthly" ${mode==='monthly'?'selected':''}>Monthly</option><option value="quarterly" ${mode==='quarterly'?'selected':''}>Quarterly</option></select> <button class="button" id="cash-export">Download monthly CSV</button></div></div>${table(cols.map(c=>c.label),rows)}<p class="sub">Opening cash + receipts − payments + bank revaluation + presentation adjustment = closing cash. Quarterly and YTD balances use the first opening and last closing; balances are never summed.</p>${note('Gross receipts and payments include funding, same-entity transfers and intercompany movements. These are recorded bank cash flows, not verified operating / investing / financing categories. Operating cash burn and runway are therefore not calculated.',true)}</section><div class="grid" style="margin-top:20px"><section class="panel"><h2>Cash at each month-end</h2>${graph(ms,[{key:'closing',label:'Closing bank cash',color:'#125341'}])}</section><section class="panel"><h2>Receipts less bank payments</h2>${graph(ms,[{key:'netMovement',label:'Net bank movement before FX',color:'#5a91af'}])}<p class="sub">A positive month can reflect new funding or transfers. It does not establish positive operating cash flow.</p></section></div><section class="panel"><h2>Trace to the bank accounts</h2>${banks}<p class="sub">${esc(DATA.cashFlow.basis)}</p><p class="sub">The demo uses a constant illustrative CAD → USD rate of 0.75. All bank movements are fictional.</p>${DATA.cashFlow.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`).join(' · ')}<p class="sub">This demo has no connection to Xero, Google Sheets or any real bank account.</p></section>`;}
function downloadCash(){let rows=[['Month','Entity','Currency','Opening cash','Receipts including transfers','Payments including transfers','Net bank movement','Bank currency revaluation','Presentation FX adjustment','Closing cash','Cash reconciliation difference']];cashSelected().forEach(m=>rows.push([m.month,entity,'USD',...['opening','received','spent','netMovement','revaluation','translation','closing','difference'].map(k=>m[entity][k].toFixed(2))]));let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`Gruffies-Demo-FY2026-${period}-${entity}-bank-cash.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function sources(){return `<div class="intro"><div><div class="eyebrow">Public demonstration</div><h1>Demo data and checks</h1><div class="sub">Entirely fictional figures · no live financial sources</div></div></div><section class="panel"><h2>How this demo works</h2><p>The interface illustrates a nine-month financial dashboard. Every financial amount and bank movement was generated independently for demonstration; none represents actual Gruffies results. Real workbook links, bank names, account identifiers and company-specific observations are excluded.</p><p>The constant illustrative CAD → USD rate is 0.75. Balance sheets and cash continuity reconcile by construction. Checks demonstrate calculation behavior and are not an audit of real financial records.</p><p>No intercompany eliminations are illustrated. Bank movements have no verified operating, investing or financing classifications.</p></section>`;}
function render(){document.getElementById('app').innerHTML=`<header><div><div class="brand">Gruffies <span>Finance & management</span></div><div class="topnote">FY2026 · Q1–Q3 · USD presentation</div></div><div><div class="eyebrow">PUBLIC DEMO · FICTIONAL DATA</div><div class="topnote">No actual company financials</div></div></header><main><div class="note warning"><strong>Public demo — fictional data.</strong> Figures and observations do not represent Gruffies. No live Xero or workbook connection.</div><div class="controls"><nav class="tabs" aria-label="Dashboard views">${[['overview','CFO Overview'],['statements','Financial Statements'],['cashflow','Cash Flow'],['sources','Sources & Checks']].map(([k,l])=>`<button data-view="${k}" class="${view===k?'active':''}" aria-pressed="${view===k}">${l}</button>`).join('')}</nav><div class="selectors"><label for="period">Period</label><select id="period">${['YTD','Q1','Q2','Q3'].map(q=>`<option value="${q}" ${period===q?'selected':''}>${q==='YTD'?'YTD · Nov–Jul':q}</option>`).join('')}</select><label for="entity">Entity</label><select id="entity">${[['combined','Canada + US'],['canada','Canada · USD'],['us','US subsidiary']].map(([v,l])=>`<option value="${v}" ${entity===v?'selected':''}>${l}</option>`).join('')}</select></div></div>${({overview,statements,cashflow,sources}[view])()}<footer>Gruffies FY2026 · Management-prepared, unaudited · All figures are fictional. No intercompany eliminations. USD amounts rounded for display.</footer></main>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('period').onchange=e=>{period=e.target.value;render()};document.getElementById('entity').onchange=e=>{entity=e.target.value;render()};const exp=document.getElementById('cash-export');if(exp)exp.onclick=downloadCash;const mod=document.getElementById('mode');if(mod)mod.onchange=e=>{mode=e.target.value;render()};}
